# SAO Desktop Menu - by Arthur_Zid - MIT License
# Builds the optional one-click installer (SAO-Desktop-Menu-Setup.exe) on GitHub's Windows machines.
#  - Publish a Release (e.g. tag v1.1.0)  -> Setup.exe is built and attached to that Release automatically.
#  - Or: Actions tab -> "Build installer" -> "Run workflow" -> download it from the run's "Artifacts".
name: Build installer

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # needed to attach Setup.exe to the Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get the project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the build tools (only on GitHub's machine)
        run: python -m pip install --upgrade pip pyinstaller pillow

      - name: Turn the menu into "SAO Desktop Menu.exe"
        run: >
          pyinstaller --noconfirm --windowed --name "SAO Desktop Menu" --icon app.ico
          --add-data "sao-desktop.html;." --add-data "icons.ps1;." --add-data "LICENSE.txt;."
          --add-data "wallpapers;wallpapers" launcher.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build SAO-Desktop-Menu-Setup.exe
        shell: pwsh
        run: |
          $v = "1.0.0"
          if ("${{ github.event_name }}" -eq "release") { $v = "${{ github.event.release.tag_name }}".TrimStart("v", "V") }
          $env:APP_VERSION = $v
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Keep a copy on this run (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: SAO-Desktop-Menu-Setup
          path: installer-output/SAO-Desktop-Menu-Setup.exe

      - name: Attach Setup.exe to the Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "installer-output/SAO-Desktop-Menu-Setup.exe" --clobber
